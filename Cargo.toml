[package]
name = "bridge"
version = "0.1.0"
edition = "2024"
default-run = "bridge"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "migrate", "json"] }
governor = "0.6"
rand = "0.8"
dashmap = "6"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
moka = { version = "0.12", features = ["future"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
async-trait = "0.1.92"
base64 = "0.22"
hex = "0.4"
bs58 = "0.5"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", features = ["ring"] }
futures-util = "0.3"
redis = {
    version = "0.27",
    features = [
        "tokio-comp",
        "connection-manager",
        "tls-rustls",
        "tokio-rustls-comp"
    ]
}
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["cors"] }
tokio-util = "0.7"
mimalloc = "0.1.52"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false, features = ["http-listener"] }

[dev-dependencies]
testcontainers-modules = { version = "0.11", features = ["postgres", "redis"] }
# Paused-clock tests for the ingest keepalive (`tokio::time::pause`).
tokio = { version = "1", features = ["test-util"] }
